name: flutter_map_navigator
description: "A production-grade, open-source Flutter navigation plugin and SDK with background tracking, turn-by-turn navigation, rerouting, voice, and vehicle tracking."
version: 0.0.1
homepage: https://github.com/Githubsaveme/flutter_map_navigator.git

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  latlong2: ^0.9.0
  flutter_map: ^6.1.0
  http: ^1.2.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flutter_map_navigator
        pluginClass: FlutterMapNavigatorPlugin
      ios:
        pluginClass: FlutterMapNavigatorPlugin
